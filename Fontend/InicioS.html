<!doctype html>
<html lang="es" class="no-js">
  <head>
    <meta charset="UTF-8">
    <title>Inicio de sección</title>
    <link rel="stylesheet" href="estilos/estilos.css">
    <link rel="stylesheet" href="estilos/normalize.css">
    <link rel="shortcut icon" href="img/LogoFindrix.png" type="image/x-icon">
    <meta name="author" content="Findrix">
    <meta name="keywords" content="Findrix">
    <meta name="description" content="Findrix es una plataforma que ayuda a las personas a gestionar sus finanzas personales de manera más eficiente.">
    <script src="js/modernizr.js"></script>
    <script src="js/prefixfree.js"></script>
  </head>
  <body>
    <main>
      <div class="login">
        <div class="formulario-login">
          <h1>Findrix</h1>
          <h2>Bienvenido</h2>
          <p>Inicia sesión para continuar</p>
          <form>
            <p>Correo:</p>
            <input type="email" placeholder="Correo" required autofocus>
            <p>Contraseña:</p>
            <input type="password" placeholder="Contraseña" required>
            <br><br>
            <input class="boton" type="submit" value="Inciar sección">
          </form>
          <div class="NoCuenta">
            <p>¿No tienes cuenta?</p>
            <a href="Registrar.html">Regístrate</a>
          </div>
        </div>
      </div>
    </main>

    <script src="js/Login.js"></script>
  </body>
</html>
