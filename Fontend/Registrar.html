<!DOCTYPE html>
<html lang="es" class="no-js">
<head>
    <meta charset="UTF-8">
    <title>Registrarse</title>
    <link rel="stylesheet" href="estilos/estilos.css">
    <link rel="stylesheet" href="estilos/normalize.css">
    <link rel="shortcut icon" href="img/LogoFindrix.png" type="image/x-icon">
    <meta name="author" content="Findrix">
    <meta name="keywords" content="Findrix">
    <meta name="description" content="Findrix es una plataforma que ayuda a las personas a gestionar sus finanzas personales de manera más eficiente.">
    <script src="js/modernizr.js"></script>
    <script src="js/prefixfree.js"></script>
</head>
<body>
    
    <main>
        <div class="registrar">
            <div class="formulario-registro">
                <h1>Findrix</h1>
                <h2>Bienvenido</h2>
                <p>Registrate para continuar</p>
                <form>
                    <div id="registrar">
                    <input type="text" placeholder="Primer nombre" required autofocus>
                    <input type="text" placeholder="Segundo nombre" required>
                    <input type="text" placeholder="Primer apellido" required>
                    <input type="text" placeholder="Segundo apellido" required>
                    <input type="email" placeholder="Correo electronico" required>
                    <input type="password" placeholder="Contraseña" required>
                    <input type="password" placeholder="Confirmar Contraseña" required>
                    </div>
                    <br>
                    <input class="boton" type="submit" value="Inciar sección">
                    <p>¿Ya tienes una cuenta?</p>
                    <a href="InicioS.html">Iniciar sesión</a>
                </form>
            </div>
        </div>
    </main>

    <script src="js/registrarse.js"></script>

</body>
</html>
